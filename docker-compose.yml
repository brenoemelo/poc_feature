services:
  localstack:
    image: localstack/localstack:4.13.0
    container_name: localstack
    ports:
      - 4566:4566 # LocalStack Gateway
      - 4510-4559:4510-4559 # external services port range
    environment:
      - DEBUG=${DEBUG:-0}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - GATEWAY_LISTEN=0.0.0.0:4566
      - TZ=Etc/UTC
      - LAMBDA_DOCKER_NETWORK=poc_feature_poc-net
      - LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT=60 # Increase startup timeout for .NET
    volumes:
      - ${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      # - ./deployment/docker/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh # Script de inicialização
      - ./deployment/docker/infra-config.env:/etc/localstack/infra-config.env # Shared configuration
      - ./deploy:/opt/deploy # Artifacts zipped for Lambda creation
    networks:
      - poc-net

  # -----------------------------------------------------
  # OpenTelemetry Collector (The Gateway)
  # Receives OTLP (gRPC/HTTP) from .NET Apps
  # Exports to Tempo, Prometheus, Loki
  # -----------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./docker/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus exporter metrics
      - "13133:13133" # Health check extension
    networks:
      - poc-net
    depends_on:
      - tempo
      - loki
      - prometheus

  # -----------------------------------------------------
  # Tempo (Distributed Tracing Backend)
  # -----------------------------------------------------
  tempo:
    image: grafana/tempo:2.7.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    user: root # Avoid permission issues
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200" # Tempo HTTP
      - "4319:4317" # OTLP gRPC (Mapped to 4319 to avoid conflict with Collector)
    networks:
      - poc-net

  # -----------------------------------------------------
  # Prometheus (Metrics Backend)
  # -----------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver # Enable pushing metrics from OTel Collector
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./docker/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - poc-net

  # -----------------------------------------------------
  # Loki (Logs Backend)
  # -----------------------------------------------------
  loki:
    image: grafana/loki:3.6.6
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    user: root # Avoid permission issues
    volumes:
      - ./docker/observability/loki.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - poc-net

  # -----------------------------------------------------
  # Grafana (The UI)
  # -----------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./docker/observability/provisioning:/etc/grafana/provisioning # Auto-configure datasources and dashboards
      - ./docker/observability/dashboards:/etc/grafana/dashboards # JSON Dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - poc-net
    depends_on:
      - tempo
      - prometheus
      - loki

  # -----------------------------------------------------
  # Feature Flag Management (Unleash + PostgreSQL)
  # Self-hosted Unleash instance with PostgreSQL backend
  # Access dashboard at http://localhost:4242
  # -----------------------------------------------------
  postgres:
    image: postgres:15.5-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: unleash_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: unleash
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - poc-net
    healthcheck:
      test: [ "CMD", "pg_isready", "--username", "unleash_user", "--dbname", "unleash" ]
      interval: 10s
      timeout: 5s
      retries: 5

  unleash:
    image: unleashorg/unleash-server:latest
    container_name: unleash
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: unleash
      DATABASE_USERNAME: unleash_user
      DATABASE_PASSWORD: password
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
      INIT_CLIENT_API_TOKENS: "*:development.unleash-insecure-api-token"
      INIT_ADMIN_API_TOKENS: "*:*.admin-token"
      UNLEASH_DEFAULT_ADMIN_PASSWORD: "password"
    ports:
      - "4242:4242"
    networks:
      - poc-net
    depends_on:
      postgres:
        condition: service_healthy

  # -----------------------------------------------------
  # Unleash Initialization
  # Auto-configures Strategies and Flags
  # -----------------------------------------------------
  unleash-init:
    image: badouralix/curl-jq
    container_name: unleash-init
    volumes:
      - ./scripts/init-unleash.sh:/init.sh
      - ./src:/src
    command: [ "sh", "/init.sh" ]
    networks:
      - poc-net
    depends_on:
      - unleash

networks:
  poc-net:
    driver: bridge

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
  postgres-data:
