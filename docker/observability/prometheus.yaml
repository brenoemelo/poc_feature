global:
  scrape_interval: 15s      # Standard interval for 2025: balances resolution and storage
  scrape_timeout: 10s       # Must be lower than interval to prevent scraping overlaps
  evaluation_interval: 15s  # How often to evaluate alerting rules

  # Useful for identifying data source in high-availability or multi-cluster setups
  external_labels:
    cluster: 'aws-production-01'
    namespace: 'observability'

scrape_configs:
  # 1. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. OTel Collector Internal Metrics (Health & Performance)
  # The Collector exposes its own relay performance metrics on port 8888 by default
  - job_name: 'otel-collector-internal'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['otel-collector:8888']

  # 3. Application Metrics (Exposed via Collector's Prometheus Exporter)
  # This is where your.NET 8 application metrics (Meter API) arrive
  - job_name: 'otel-collector-apps'
    scrape_interval: 10s     # Faster interval for critical business/app metrics
    honor_labels: true       # Preserves original labels sent by the.NET SDK
    static_configs:
      - targets: ['otel-collector:8889']
    
    # Enable OpenMetrics format to support Exemplars (Trace-to-Metric correlation)
    params:
      format: ["openmetrics"]

    # Cardinality Management: Drop high-cardinality or debug labels before storage
    metric_relabel_configs:
      # Drop metrics containing "debug" to save disk space
      - source_labels: [__name__]
        regex: '.*_debug_.*'
        action: drop
      # Remove temporary or internal OTel labels
      - action: labeldrop
        regex: 'otel_scope_.*'