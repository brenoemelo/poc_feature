receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 10

  resourcedetection:
    detectors: [env, ec2, ecs, eks]
    timeout: 2s
    override: false

  batch:
    send_batch_size: 1024
    timeout: 5s

connectors:
  spanmetrics:
    metrics_flush_interval: 15s
    dimensions:
      - name: http.method
      - name: http.status_code
      - name: http.route
      - name: db.system
      - name: db.name
      - name: db.operation
      - name: aws.service
      - name: rpc.method
      - name: rpc.service
      - name: exception.type
    histogram:
      explicit:
        buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]

  servicegraph:
    latency_histogram_buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
    dimensions: [http.method, http.status_code]
    store:
      max_items: 10000
      ttl: 10s 

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
    sending_queue:
      enabled: true
      num_consumers: 4 
      queue_size: 1000

  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion: { enabled: true }

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, memory_limiter, batch]
      exporters: [otlp/tempo, spanmetrics, servicegraph]
    metrics:
      receivers: [otlp, spanmetrics, servicegraph]
      processors: [resourcedetection, memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, memory_limiter, batch]
      exporters: [otlphttp/loki]