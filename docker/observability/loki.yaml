auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  # Best Practice: chunk_target_size -> 1.5MB
  chunk_target_size: 1536000
  # Best Practice: max_chunk_age -> 2h
  max_chunk_age: 2h
  # Best Practice: chunk_idle_period -> 30m
  chunk_idle_period: 30m
  chunk_encoding: snappy # Snappy is faster, good for performance
  wal:
    enabled: true
    dir: /loki/wal
    replay_memory_ceiling: 4GB

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

limits_config:
  retention_period: 168h # 7 days retention
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_cache_freshness_per_query: 10m
  split_queries_by_interval: 15m
  unordered_writes: true # Allow out-of-order writes (default true in recent versions, but explicit is safe)

analytics:
  reporting_enabled: false
